name: Bug report
description: Report a reproducible problem in Annotation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not attach private datasets, credentials, or sensitive images."
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Chrome 125 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using non-sensitive sample data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
